name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and package both editions
        shell: pwsh
        run: ./package.ps1 -Locked
      - uses: actions/upload-artifact@v4
        with:
          name: secret-vision-release-check
          path: dist/v*/
